name: Daily AI brief update

# Runs every day at 06:00 UTC. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Draft today's entries with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-update.mjs

      - name: Sync embedded JSON fallback in index.html
        run: node scripts/sync-embedded.mjs

      - name: Commit and push to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/entries.json data/sources.json index.html
          git diff --cached --quiet || git commit -m "chore: daily AI brief update $(date -u +%Y-%m-%d)"
          git push
