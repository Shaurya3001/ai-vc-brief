<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Brief By Shaurya Gulati — VC Intelligence · US · Canada · India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080D16;
    --bg-2:     #0C1220;
    --surface:  #111827;
    --card:     #151E2E;
    --card-2:   #1A2438;
    --border:   #1E2D45;
    --border-2: #2A3F60;
    --text:     #E2E8F7;
    --text-2:   #7F92BB;
    --text-3:   #4A5878;
    --accent:   #6366F1;
    --accent-2: #818CF8;
    --accent-g: rgba(99,102,241,0.12);
    --new:      #10B981;
    --new-bg:   rgba(16,185,129,0.1);
    --updated:  #F59E0B;
    --upd-bg:   rgba(245,158,11,0.1);
    --stale:    #475569;
    --stale-bg: rgba(71,85,105,0.12);
    --us:       #3B82F6;
    --canada:   #EF4444;
    --india:    #FBBF24;
    --global:   #34D399;
    --c-capital:        #F59E0B;
    --c-companies:      #6366F1;
    --c-technology:     #8B5CF6;
    --c-infrastructure: #0EA5E9;
    --c-adoption:       #10B981;
    --c-policy:         #EF4444;
    --c-talent:         #F97316;
    --c-theses:         #EC4899;
    --mono:    "JetBrains Mono", ui-monospace, monospace;
    --sans:    "Inter", system-ui, sans-serif;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --r:  10px;
    --rs: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* ── grid texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,45,69,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,45,69,0.5) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ── HEADER ── */
  header.mast {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,13,22,0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
  }
  header.mast::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #6366F1 0%, #8B5CF6 33%, #EC4899 66%, #6366F1 100%);
    background-size: 200% 100%;
    animation: flow 5s linear infinite;
  }
  @keyframes flow { to { background-position: -200% 0; } }

  .mast-top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0 10px;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand h1 {
    font-family: var(--display);
    font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: -0.03em;
    background: linear-gradient(130deg, #E2E8F7 30%, #818CF8 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .brand .byline {
    font-family: var(--display); font-size: 11px; font-weight: 500;
    color: var(--text-3); letter-spacing: 0.02em; margin-top: 1px;
  }
  .brand .sub {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-3);
  }
  .live-badge { display: flex; align-items: center; gap: 10px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--new); flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(16,185,129,0.5);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
    50%      { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
  }
  .live-text {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); line-height: 1.65;
  }
  .live-text b { color: var(--new); font-weight: 500; }

  /* stats strip */
  .stats-strip {
    display: flex; gap: 0; border-top: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .stats-strip::-webkit-scrollbar { display: none; }
  .stat-item {
    padding: 8px 20px; border-right: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .stat-item:last-child { border-right: none; }
  .stat-n {
    font-family: var(--display); font-size: 17px; font-weight: 700;
    color: var(--text); letter-spacing: -0.03em;
  }
  .stat-label {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-3);
  }

  /* tabs */
  nav.tabs {
    display: flex; gap: 0; border-top: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    appearance: none; background: none; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--text-3);
    padding: 11px 18px; white-space: nowrap;
    border-bottom: 2px solid transparent; transition: all 0.18s ease;
    display: flex; align-items: center; gap: 7px;
  }
  nav.tabs button:hover { color: var(--text-2); background: rgba(255,255,255,0.02); }
  nav.tabs button[aria-current="true"] { color: var(--accent-2); border-bottom-color: var(--accent); }
  nav.tabs button .ct {
    background: var(--surface); color: var(--text-3);
    font-size: 9px; padding: 1px 6px; border-radius: 10px;
    border: 1px solid var(--border);
  }
  nav.tabs button[aria-current="true"] .ct {
    background: var(--accent-g); color: var(--accent-2); border-color: var(--accent);
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 16px 0; border-bottom: 1px solid var(--border);
  }
  .search {
    flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--rs); padding: 9px 13px; transition: all 0.18s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-g); }
  .search input {
    border: none; background: none; outline: none;
    font-family: var(--sans); font-size: 13.5px; width: 100%; color: var(--text);
  }
  .search input::placeholder { color: var(--text-3); }
  .search svg { flex: none; color: var(--text-3); }

  .filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filterlabel {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-3);
  }
  .chip {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-3);
    padding: 5px 11px; border-radius: 20px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--border-2); color: var(--text-2); }
  .chip[aria-pressed="true"] { background: var(--accent-g); color: var(--accent-2); border-color: var(--accent); }
  .chip .geodot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* sample banner */
  .banner {
    background: rgba(245,158,11,0.07); border: 1px solid rgba(245,158,11,0.22);
    border-radius: var(--rs); font-family: var(--mono); font-size: 11px; color: #D97706;
    padding: 10px 14px; margin-top: 16px; display: flex; gap: 10px; line-height: 1.55;
  }

  /* ── MAIN ── */
  main { padding: 8px 0 80px; min-height: 60vh; }

  .lede {
    font-size: 14.5px; line-height: 1.7; color: var(--text-2);
    margin: 22px 0 26px; max-width: 68ch;
  }

  /* cluster / section headings */
  .cluster-head {
    display: flex; align-items: center; gap: 12px;
    margin: 44px 0 10px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .cl-badge {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-3);
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 4px;
  }
  .cl-label {
    font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .cl-blurb { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-left: auto; }

  .sec-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 24px 0 12px;
  }
  .sec-head-left { display: flex; align-items: center; gap: 10px; }
  .sec-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .sec-head h3 {
    font-family: var(--display); font-weight: 600; font-size: 19px;
    letter-spacing: -0.02em; color: var(--text);
  }
  .sec-meta {
    font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap;
  }
  .sec-blurb { font-size: 13px; color: var(--text-3); margin: -8px 0 16px; }

  /* ── ENTRY CARDS ── */
  .feed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

  .entry {
    background: var(--card); border: 1px solid var(--border);
    border-left-width: 3px; border-radius: var(--r);
    padding: 18px 20px; transition: all 0.2s ease; position: relative; overflow: hidden;
  }
  .entry::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.025) 0%, transparent 50%);
    pointer-events: none;
  }
  .entry:hover {
    background: var(--card-2); border-color: var(--border-2);
    transform: translateY(-1px); box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .entry[data-section="capital"]        { border-left-color: var(--c-capital); }
  .entry[data-section="companies"]      { border-left-color: var(--c-companies); }
  .entry[data-section="technology"]     { border-left-color: var(--c-technology); }
  .entry[data-section="infrastructure"] { border-left-color: var(--c-infrastructure); }
  .entry[data-section="adoption"]       { border-left-color: var(--c-adoption); }
  .entry[data-section="policy"]         { border-left-color: var(--c-policy); }
  .entry[data-section="talent"]         { border-left-color: var(--c-talent); }
  .entry[data-section="theses"]         { border-left-color: var(--c-theses); }

  .entry-top {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .e-date { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .e-sec {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-3); background: var(--surface); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 4px;
  }
  .geo {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-3); display: inline-flex; align-items: center; gap: 4px;
  }
  .geo .geodot { width: 6px; height: 6px; border-radius: 50%; }

  .status {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 12px; margin-left: auto; font-weight: 500;
  }
  .status.new     { background: var(--new-bg); color: var(--new);     border: 1px solid rgba(16,185,129,0.25); }
  .status.updated { background: var(--upd-bg); color: var(--updated); border: 1px solid rgba(245,158,11,0.25); }
  .status.stale   { background: var(--stale-bg); color: var(--stale); border: 1px solid rgba(71,85,105,0.25); }

  .entry h4 {
    font-family: var(--display); font-weight: 600; font-size: 17px;
    line-height: 1.3; letter-spacing: -0.02em; color: var(--text); margin: 0 0 10px;
  }
  .summary {
    font-size: 13.5px; color: var(--text-2); line-height: 1.65;
    margin: 0 0 12px; max-width: 76ch;
  }
  .why {
    border-left: 2px solid var(--accent); padding: 5px 0 5px 14px;
    margin: 0 0 12px; max-width: 72ch;
    background: var(--accent-g); border-radius: 0 var(--rs) var(--rs) 0;
  }
  .why .lbl {
    font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent-2); display: block; margin-bottom: 3px;
  }
  .why p { font-size: 13px; color: var(--text-2); font-style: italic; margin: 0; line-height: 1.55; }

  .srcs { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .slbl {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-3);
  }
  .src {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
    border: 1px solid var(--border); background: var(--surface);
    padding: 2px 9px; border-radius: 4px;
    display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
  }
  .src:hover { color: var(--accent-2); border-color: var(--accent); }
  .src .stype {
    font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-3); background: var(--card); padding: 0 3px; border-radius: 2px;
  }

  /* ── COUNTRIES ── */
  .ctry-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 16px; margin: 24px 0;
  }
  .ctry-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r); padding: 20px; transition: all 0.2s ease;
  }
  .ctry-card:hover { border-color: var(--border-2); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .ctry-card-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .ctry-card h3 {
    font-family: var(--display); font-weight: 600; font-size: 18px;
    display: flex; align-items: center; gap: 8px; color: var(--text);
  }
  .ctry-flag { display:inline-flex; align-items:center; line-height:1; }
  .cc-count {
    font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 12px;
  }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar {
    display: grid; grid-template-columns: 108px 1fr 22px;
    align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
    cursor: pointer; padding: 3px 4px; border-radius: 4px; transition: background 0.15s;
  }
  .bar:hover { background: var(--surface); }
  .bar:hover .bar-label { color: var(--text-2); }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track {
    height: 5px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.9s cubic-bezier(0.4,0,0.2,1); }
  .bar-n { text-align: right; }
  .fill-us     { background: linear-gradient(90deg, #3B82F6, #60A5FA); }
  .fill-canada { background: linear-gradient(90deg, #EF4444, #F87171); }
  .fill-india  { background: linear-gradient(90deg, #FBBF24, #FCD34D); }

  .ctry-feed-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 30px 0 14px; padding-top: 26px; border-top: 1px solid var(--border);
  }
  .ctry-feed-head h3 {
    font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--text);
  }
  .ctry-feed-head .meta {
    font-family: var(--mono); font-size: 9.5px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ── SOURCES TABLE ── */
  .srcreg-wrap {
    overflow-x: auto; margin-top: 22px;
    border: 1px solid var(--border); border-radius: var(--r);
  }
  table.srcreg { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
  table.srcreg th {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-3); text-align: left; padding: 12px 14px;
    border-bottom: 1px solid var(--border); background: var(--surface); white-space: nowrap;
  }
  table.srcreg td {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    vertical-align: top; color: var(--text-2);
  }
  table.srcreg tr:last-child td { border-bottom: none; }
  table.srcreg tr:hover td { background: rgba(255,255,255,0.015); }
  .pubtype {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
    border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; color: var(--text-3);
  }
  .srcreg a { color: var(--accent-2); font-family: var(--mono); font-size: 11px; transition: color 0.15s; }
  .srcreg a:hover { color: var(--text); }

  /* ── ABOUT ── */
  .about { max-width: 66ch; color: var(--text-2); line-height: 1.72; padding-top: 8px; }
  .about h3 {
    font-family: var(--display); font-weight: 600; font-size: 17px;
    color: var(--text); margin: 30px 0 8px; letter-spacing: -0.01em;
  }
  .about p { margin: 0 0 12px; font-size: 14px; }
  .about code {
    font-family: var(--mono); font-size: 11.5px; background: var(--surface);
    border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; color: var(--accent-2);
  }
  .pipe-steps {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--r); padding: 20px 22px; margin: 16px 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .step { display: flex; gap: 13px; align-items: flex-start; font-size: 13.5px; }
  .step-num {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--accent-2);
    background: var(--accent-g); border: 1px solid var(--accent); border-radius: 50%;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .step-body { color: var(--text-2); }
  .step-body b { color: var(--text); font-weight: 600; }

  .empty {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-3);
    padding: 60px 0; text-align: center; letter-spacing: 0.05em;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border); padding: 24px 0 44px;
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px;
  }
  .footer-left { display: flex; flex-direction: column; gap: 5px; }
  .footer-brand {
    font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .footer-contact {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
  }
  .footer-contact a {
    color: var(--accent-2); transition: color 0.15s;
  }
  .footer-contact a:hover { color: var(--text); }
  .footer-right {
    text-align: right; font-family: var(--mono); font-size: 10px;
    color: var(--text-3); line-height: 1.9;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .brand h1 { font-size: 20px; }
    .live-text { display: none; }
    .entry h4 { font-size: 16px; }
    .sec-head h3 { font-size: 17px; }
    .ctry-grid { grid-template-columns: 1fr; }
    .stat-item { padding: 8px 12px; }
  }
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <div class="brand">
        <h1>The AI Brief</h1>
        <div class="byline">by Shaurya Gulati</div>
        <div class="sub">Venture Intelligence · United States · Canada · India</div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        <div class="live-text" id="asof"></div>
      </div>
    </div>
    <div class="stats-strip" id="statsstrip"></div>

    },
    {
      "id": "2026-05-13-notion-agent-platform",

      "subtag": "breakouts",
      "geography": ["US", "Global"],
      "status": "new",

      "why_it_matters": "Workspace incumbents racing to become agent orchestration layers raises the distribution bar for horizontal-agent startups — investors should push for domain data moats, not just orchestration primitives.",

    {

<script>
const GEO_COLOR = { US: 'var(--us)', Canada: 'var(--canada)', India: 'var(--india)', Global: 'var(--global)' };
const GEO_FLAG  = {
  US: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#B22234"/><rect y="1.15" width="22" height="1.15" fill="#fff"/><rect y="3.46" width="22" height="1.15" fill="#fff"/><rect y="5.77" width="22" height="1.15" fill="#fff"/><rect y="8.08" width="22" height="1.15" fill="#fff"/><rect y="10.38" width="22" height="1.15" fill="#fff"/><rect y="12.69" width="22" height="1.15" fill="#fff"/><rect width="9" height="8.08" fill="#3C3B6E"/></svg>`,
  Canada: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#fff"/><rect width="5.5" height="15" fill="#D52B1E"/><rect x="16.5" width="5.5" height="15" fill="#D52B1E"/><polygon points="11,2.5 12.2,5.5 15.5,5.5 12.8,7.5 13.8,10.5 11,8.5 8.2,10.5 9.2,7.5 6.5,5.5 9.8,5.5" fill="#D52B1E"/></svg>`,
  India: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#fff"/><rect width="22" height="5" fill="#FF9933"/><rect y="10" width="22" height="5" fill="#138808"/><circle cx="11" cy="7.5" r="2.2" fill="none" stroke="#000080" stroke-width="0.6"/><circle cx="11" cy="7.5" r="0.4" fill="#000080"/></svg>`,
  Global: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#1E2535" rx="2"/><circle cx="11" cy="7.5" r="5" fill="none" stroke="#34D399" stroke-width="1"/><ellipse cx="11" cy="7.5" rx="2.5" ry="5" fill="none" stroke="#34D399" stroke-width="0.8"/><line x1="6" y1="7.5" x2="16" y2="7.5" stroke="#34D399" stroke-width="0.8"/></svg>`
};
const GEO_FILL  = { US: 'fill-us', Canada: 'fill-canada', India: 'fill-india', Global: 'fill-us' };
const SEC_COLOR = {
  capital: 'var(--c-capital)', companies: 'var(--c-companies)',
  technology: 'var(--c-technology)', infrastructure: 'var(--c-infrastructure)',
  adoption: 'var(--c-adoption)', policy: 'var(--c-policy)',
  talent: 'var(--c-talent)', theses: 'var(--c-theses)'
};

const state = { view: 'week', q: '', geos: new Set(), statuses: new Set(), country: 'US', countrySec: null };
let TAX, SRC, ENT, SRCMAP;

function readEmbedded(id) {
  try { return JSON.parse(document.getElementById(id).textContent); } catch(e) { return null; }
}

async function load() {
  async function grab(path, embId) {
    try { const r = await fetch(path, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch(e) {}
    return readEmbedded(embId);
  }
  TAX = await grab('./data/taxonomy.json', 'embedded-taxonomy');
  SRC = await grab('./data/sources.json',  'embedded-sources');
  ENT = await grab('./data/entries.json',  'embedded-entries');
  SRCMAP = {}; (SRC.sources || []).forEach(s => SRCMAP[s.id] = s);
  ENT.entries = (ENT.entries || []).sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') || (b.added || '').localeCompare(a.added || ''));
  buildChrome(); render();
}

function refDate() {
  const m = ENT.entries.reduce((x, e) => e.added && e.added > x ? e.added : x, '');
  return m ? new Date(m) : new Date();
}
function inWeek(e) {
  const ref = refDate(), win = new Date(ref.getTime() - 7 * 864e5);
  return e.added && new Date(e.added) >= win;
}
function fmtRange() {
  const ref = refDate(), win = new Date(ref.getTime() - 7 * 864e5);
  const f = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return f(win) + ' – ' + f(ref) + ', ' + ref.getFullYear();
}
function nextRefresh() {
  const d = new Date(); const day = d.getDay(); const add = ((8 - day) % 7) || 7;
  const n = new Date(d.getTime() + add * 864e5);
  return n.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function secById(id) { return TAX.sections.find(s => s.id === id); }
function clusterSections(cid) { return TAX.sections.filter(s => s.cluster === cid); }

function passes(e) {
  if (state.geos.size && !e.geography.some(g => state.geos.has(g))) return false;
  if (state.statuses.size && !state.statuses.has(e.status)) return false;
  if (state.q) {
    const t = (e.title + ' ' + e.summary + ' ' + e.why_it_matters).toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false;
  }
  return true;
}
function filtered() { return ENT.entries.filter(passes); }

/* ── chrome ── */
function buildChrome() {
  const wk = ENT.entries.filter(inWeek).length;
  const all = ENT.entries.length;
  const srcs = (SRC.sources || []).length;
  const secs = TAX.sections.length;

  // stats strip
  document.getElementById('statsstrip').innerHTML = [
    [wk,  'this week'],
    [all, 'total entries'],
    [srcs,'sources'],
    [secs,'sections'],
    [3,   'markets'],
  ].map(([n, l]) =>
    `<div class="stat-item"><span class="stat-n">${n}</span><span class="stat-label">${l}</span></div>`
  ).join('');

  // tabs
  const tabs = [
    ['week',     'This week', wk],
    ['sections', 'Sections',  all],
    ['countries','Countries', null],
    ['sources',  'Sources',   srcs],
    ['about',    'About',     null],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([id, lab, ct]) =>
    `<button data-v="${id}" aria-current="${state.view === id}">${lab}${ct != null ? `<span class="ct">${ct}</span>` : ''}</button>`
  ).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    state.view = b.dataset.v; buildChrome(); render(); window.scrollTo(0, 0);
  });

  // live badge
  document.getElementById('asof').innerHTML =
    `<b>LIVE</b> · as of ${refDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}<br>next refresh · ${nextRefresh()}`;

  // geo chips
  document.getElementById('geochips').innerHTML =
    `<span class="filterlabel">Geo</span>` +
    TAX.geographies.map(g =>
      `<button class="chip" data-g="${g}" aria-pressed="${state.geos.has(g)}" aria-label="Filter by ${g}">
        <span class="geodot" style="background:${GEO_COLOR[g]}"></span>${g}
      </button>`
    ).join('');
  document.querySelectorAll('#geochips .chip').forEach(c => c.onclick = () => {
    const g = c.dataset.g; state.geos.has(g) ? state.geos.delete(g) : state.geos.add(g);
    buildChrome(); render();
  });

  // status chips
  document.getElementById('statuschips').innerHTML =
    `<span class="filterlabel">Status</span>` +
    TAX.statuses.map(s =>
      `<button class="chip" data-s="${s}" aria-pressed="${state.statuses.has(s)}" aria-label="Filter by ${s}">${s}</button>`
    ).join('');
  document.querySelectorAll('#statuschips .chip').forEach(c => c.onclick = () => {
    const s = c.dataset.s; state.statuses.has(s) ? state.statuses.delete(s) : state.statuses.add(s);
    buildChrome(); render();
  });

  // sample banner
  const nSample = ENT.entries.filter(e => e.sample).length;
  document.getElementById('banner').innerHTML = nSample
    ? `<div class="banner">◆ &nbsp;<span><b>Sample data.</b> ${nSample} of ${ENT.entries.length} entries are illustrative placeholders. They are replaced automatically when the weekly pipeline runs, or edit <b>data/entries.json</b> directly.</span></div>`
    : '';

  // footer stats
  document.getElementById('foot-stats').innerHTML =
    `The AI Brief By Shaurya Gulati · structured AI-market intelligence<br>${all} entries · ${srcs} sources · ${secs} sections`;
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });

/* ── entry card ── */
function entryHTML(e) {
  const sec  = secById(e.section);
  const col  = SEC_COLOR[e.section] || 'var(--border)';
  const geos = e.geography.map(g =>
    `<span class="geo"><span class="geodot" style="background:${GEO_COLOR[g]}"></span>${g}</span>`
  ).join('');
  const srcs = (e.sources || []).map(id => {
    const s = SRCMAP[id]; if (!s) return '';
    const inner = `<span class="stype">${s.type}</span>${s.publisher || s.title}`;
    const href  = s.url && s.url !== '#' ? s.url : null;
    return href
      ? `<a class="src" href="${href}" target="_blank" rel="noopener">${inner} ↗</a>`
      : `<span class="src">${inner}</span>`;
  }).join('');

  return `<article class="entry" data-section="${e.section}">
    <div class="entry-top">
      <span class="e-date">${e.date}</span>
      <span class="e-sec" style="border-color:${col};color:${col}">${sec ? sec.label : e.section}${e.subtag ? ' · ' + e.subtag.replace(/-/g, ' ') : ''}</span>
      ${geos}
      <span class="status ${e.status}">${e.status}</span>
    </div>
    <h4>${e.title}</h4>
    <p class="summary">${e.summary}</p>
    <div class="why"><span class="lbl">Why it matters</span><p>${e.why_it_matters}</p></div>
    ${srcs ? `<div class="srcs"><span class="slbl">Source</span>${srcs}</div>` : ''}
  </article>`;
}

function feed(list) {
  return list.length
    ? `<div class="feed">${list.map(entryHTML).join('')}</div>`
    : `<div class="empty">No entries match the current filters.</div>`;
}

/* ── views ── */
function viewWeek() {
  const list = filtered().filter(inWeek);
  let html = `<p class="lede">The week's signal across the AI economy, filed by type and tagged by market. Window: ${fmtRange()}.</p>`;
  TAX.clusters.forEach(cl => {
    const secs = clusterSections(cl.id);
    const clEntries = secs.flatMap(s => list.filter(e => e.section === s.id));
    if (!clEntries.length) return;
    html += `<div class="cluster-head">
      <span class="cl-badge">${cl.id}</span>
      <span class="cl-label">${cl.label}</span>
      <span class="cl-blurb">${cl.blurb}</span>
    </div>`;
    secs.forEach(s => {
      const es = list.filter(e => e.section === s.id); if (!es.length) return;
      const col = SEC_COLOR[s.id] || 'var(--text-3)';
      html += `<div class="sec-head">
        <div class="sec-head-left">
          <span class="sec-dot" style="color:${col};background:${col}"></span>
          <h3>${s.label}</h3>
        </div>
        <span class="sec-meta">${es.length} this week · ${s.cadence}</span>
      </div>`;
      html += feed(es);
    });
  });
  if (!list.length) html += `<div class="empty">No entries in this window match the current filters.</div>`;
  return html;
}

function viewSections() {
  const list = filtered();
  let html = `<p class="lede">Every fact lives in exactly one section, chosen by its type — a round is a transaction, a startup is an entity, a chip is an asset. Cross-referenced, never duplicated.</p>`;
  TAX.clusters.forEach(cl => {
    html += `<div class="cluster-head">
      <span class="cl-badge">${cl.id}</span>
      <span class="cl-label">${cl.label}</span>
      <span class="cl-blurb">${cl.blurb}</span>
    </div>`;
    clusterSections(cl.id).forEach(s => {
      const es = list.filter(e => e.section === s.id);
      const col = SEC_COLOR[s.id] || 'var(--text-3)';
      html += `<div class="sec-head">
        <div class="sec-head-left">
          <span class="sec-dot" style="color:${col};background:${col}"></span>
          <h3>${s.label}</h3>
        </div>
        <span class="sec-meta">${es.length} ${es.length === 1 ? 'entry' : 'entries'} · ${s.cadence}</span>
      </div>`;
      html += `<p class="sec-blurb">${s.blurb}</p>`;
      html += feed(es);
    });
  });
  return html;
}

function viewCountries() {
  const list = filtered();
  let html = `<p class="lede">The same entries, pivoted by market. Geography is an overlay on the thematic sections — not a separate silo — so the three desks stay comparable.</p>`;
  html += `<div class="ctry-grid">`;
  ['US', 'Canada', 'India'].forEach(g => {
    const es  = list.filter(e => e.geography.includes(g));
    const max = Math.max(1, ...TAX.sections.map(s => es.filter(e => e.section === s.id).length));
    const bars = TAX.sections.map(s => {
      const n   = es.filter(e => e.section === s.id).length;
      const pct = Math.round(n / max * 100);
      return `<div class="bar" data-g="${g}" data-s="${s.id}" aria-label="${s.label}: ${n} entries">
        <span class="bar-label">${s.label}</span>
        <span class="bar-track"><span class="bar-fill ${GEO_FILL[g]}" style="width:${pct}%"></span></span>
        <span class="bar-n">${n}</span>
      </div>`;
    }).join('');
    const active = state.country === g ? 'border-color:var(--border-2)' : '';
    html += `<div class="ctry-card" style="${active}">
      <div class="ctry-card-header">
        <h3><span class="ctry-flag">${GEO_FLAG[g]}</span>${g}</h3>
        <span class="cc-count">${es.length} ${es.length === 1 ? 'entry' : 'entries'}</span>
      </div>
      <div class="bars">${bars}</div>
    </div>`;
  });
  html += `</div>`;

  const sel = state.country || 'US';
  let ces = list.filter(e => e.geography.includes(sel));
  const secLabel = state.countrySec ? ` · ${(secById(state.countrySec) || { label: state.countrySec }).label}` : '';
  html += `<div class="ctry-feed-head">
    <h3>${GEO_FLAG[sel]} ${sel} feed${secLabel}</h3>
    <span class="meta">click a bar to filter by section</span>
  </div>`;
  if (state.countrySec) ces = ces.filter(e => e.section === state.countrySec);
  html += feed(ces);
  return html;
}

function viewSources() {
  const list = ENT.entries;
  let rows = '';
  (SRC.sources || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(s => {
    const cited = list.filter(e => (e.sources || []).includes(s.id)).length;
    const href  = s.url && s.url !== '#'
      ? `<a href="${s.url}" target="_blank" rel="noopener">open ↗</a>` : '—';
    rows += `<tr>
      <td>${s.title}</td>
      <td style="color:var(--text-3)">${s.publisher || '—'}</td>
      <td><span class="pubtype">${s.type}</span></td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${s.date || '—'}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center">${cited}</td>
      <td>${href}</td>
    </tr>`;
  });
  return `<p class="lede">The source registry: every primary document stored once and referenced by entries. One canonical link, cited everywhere — so readers can always reach the parent report.</p>
    <div class="srcreg-wrap">
      <table class="srcreg">
        <thead><tr>
          <th>Document</th><th>Publisher</th><th>Type</th><th>Date</th><th>Cited</th><th>Link</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function viewAbout() {
  return `<div class="about">
    <p class="lede" style="margin-top:20px">
      A live, structured intelligence brief on the AI economy across the United States, Canada, and India —
      built for venture investors who need the signal, not the feed.
    </p>
    <h3>How it's organized</h3>
    <p>Eight content sections across four clusters: <b>the stack</b> (what's being built), <b>the market</b> (players & money), <b>the environment</b> (rules & people), and <b>synthesis</b> (the so-what). The organizing rule: every fact is filed by its <em>type</em> and cross-linked rather than duplicated. A funding round is a transaction (Capital); the startup that raised it is an entity (Companies); the chip it builds is an asset (Infrastructure).</p>
    <p>Geography is a cross-cutting <em>overlay</em>, not three silos. Every entry is tagged US / Canada / India / Global, and the Countries view pivots the same dataset so the three desks stay comparable.</p>
    <h3>Every entry carries</h3>
    <p>A date, geography tags, a section and sub-tag, a 2–3 sentence summary, a <code>why it matters</code> line written for an investor, one or more links into the source registry, and a status of <code>new</code>, <code>updated</code>, or <code>stale</code>.</p>
    <h3>How it stays live</h3>
    <p>A scheduled job runs every Monday. It uses Claude with web search to research the week's developments across all eight sections and three markets, drafts entries in the atomic schema, and opens a pull request for review before anything publishes.</p>
    <div class="pipe-steps">
      <div class="step"><span class="step-num">1</span><span class="step-body"><b>Schedule</b> — GitHub Actions cron fires weekly.</span></div>
      <div class="step"><span class="step-num">2</span><span class="step-body"><b>Research</b> — Claude (Anthropic API + web search) drafts entries per section, with real source URLs.</span></div>
      <div class="step"><span class="step-num">3</span><span class="step-body"><b>Validate</b> — entries are schema-checked, deduped, and aged; a PR is opened for review.</span></div>
      <div class="step"><span class="step-num">4</span><span class="step-body"><b>Publish</b> — merging rebuilds this static site automatically.</span></div>
    </div>
    <p>Cadence is tuned per section: Capital and Technology refresh daily-to-weekly, Policy is event-driven, Theses is monthly.</p>
  </div>`;
}

function render() {
  const m = document.getElementById('main');
  const v = { week: viewWeek, sections: viewSections, countries: viewCountries, sources: viewSources, about: viewAbout }[state.view];
  m.innerHTML = v();
  if (state.view === 'countries') {
    m.querySelectorAll('.bar').forEach(b => b.onclick = () => {
      const g = b.dataset.g, s = b.dataset.s;
      state.country = g;
      state.countrySec = (state.country === g && state.countrySec === s) ? null : s;
      render();
    });
  }
}

load();
</script>
</body>
</html>
