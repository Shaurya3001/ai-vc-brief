<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Brief By Shaurya Gulati — VC Intelligence · US · Canada · India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Canvas — warm near-black, never blue-black ── */
    --bg:      #0E0C0A;
    --bg-1:    #15120F;
    --bg-2:    #1C1814;
    --rule:    #2A2520;
    --rule-2:  #3A332C;

    /* ── Ink — warm ivory, never pure white ── */
    --text:    #F4EFE6;
    --text-2:  #D9D2C5;
    --text-3:  #A8A093;
    --text-4:  #6F6A60;

    /* ── Accent 1: Oxblood — editorial UI, TAKE rule, active nav ── */
    --accent:    #8B2A2A;
    --accent-hi: #B23A3A;
    --accent-g:  rgba(139,42,42,0.10);

    /* ── Accent 2: Brass — data, charts, links, geography ── */
    --brass:    #C9A24B;
    --brass-hi: #E0B968;
    --brass-g:  rgba(201,162,75,0.10);

    /* ── Geography dots ── */
    --us:     #C9A57B;
    --canada: #8FA98E;
    --india:  #C97B5E;
    --global: #A89878;

    /* ── Section colors — muted, equal luminance ── */
    --c-capital:        #C9A24B;
    --c-companies:      #6FA8A0;
    --c-technology:     #8B7AB3;
    --c-infrastructure: #7A96B3;
    --c-adoption:       #7AA87A;
    --c-policy:         #A8966A;
    --c-talent:         #A87A96;
    --c-theses:         #B3956A;

    /* ── Status ── */
    --new:      #7AA87A;
    --new-bg:   rgba(122,168,122,0.10);
    --updated:  #C9A24B;
    --upd-bg:   rgba(201,162,75,0.10);
    --stale:    #5A5650;
    --stale-bg: rgba(90,86,80,0.12);

    /* ── Type ── */
    --serif:   'Fraunces', Georgia, serif;
    --body:    'Source Serif 4', Georgia, serif;
    --ui:      'Inter Tight', system-ui, sans-serif;

    /* ── Spacing ── */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px;
    --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text-2);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: #0E0C0A; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; position: relative; }
  .wrap--wide { max-width: 1120px; margin: 0 auto; padding: 0 24px; position: relative; }

  /* ── READING PROGRESS ── */
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: var(--brass); z-index: 200;
    transform-origin: left; transform: scaleX(0);
    transition: transform 0.1s linear;
  }

  /* ── HEADER ── */
  header.mast {
    position: sticky; top: 0; z-index: 100;
    background: rgba(14,12,10,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--rule);
  }

  .mast-inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  .mast-top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 0 12px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 {
    font-family: var(--serif);
    font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: -0.01em;
    color: var(--text); font-optical-sizing: auto;
  }
  .brand .byline {
    font-family: var(--ui); font-size: 10.5px; font-weight: 500;
    color: var(--brass); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 3px;
  }
  .brand .sub {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.04em;
    color: var(--text-4);
  }
  .live-badge { display: flex; align-items: center; gap: 10px; }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--new); flex-shrink: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live-dot { animation: pulse 3s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(122,168,122,0.4); }
    50%      { box-shadow: 0 0 0 4px rgba(122,168,122,0); }
  }
  .live-text {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-4); line-height: 1.6;
  }
  .live-text b { color: var(--new); font-weight: 600; }

  /* stats strip */
  .stats-strip {
    border-top: 1px solid var(--rule);
    padding: 7px 0;
    font-size: 12px; color: var(--text-4); font-family: var(--ui);
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
  }
  .stat-item { display: inline; }
  .stat-n { color: var(--text-3); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-sep { margin: 0 10px; opacity: 0.35; }

  /* tabs */
  nav.tabs {
    display: flex; gap: 0; border-top: 1px solid var(--rule);
    overflow-x: auto; scrollbar-width: none;
    mask-image: linear-gradient(90deg, black 0, black calc(100% - 32px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, black 0, black calc(100% - 32px), transparent 100%);
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    appearance: none; background: none; border: none; cursor: pointer;
    font-family: var(--ui); font-size: 11px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-4);
    padding: 11px 18px; white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.18s ease, border-color 0.18s ease;
    display: flex; align-items: center; gap: 7px;
  }
  nav.tabs button:hover { color: var(--text-3); }
  nav.tabs button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }
  nav.tabs button .ct {
    background: var(--bg-1); color: var(--text-4);
    font-family: var(--ui); font-size: 9px; padding: 1px 6px; border-radius: 3px;
    font-variant-numeric: tabular-nums;
  }
  nav.tabs button[aria-current="true"] .ct {
    background: var(--accent-g); color: var(--text-3);
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 18px 0 16px; border-bottom: 1px solid var(--rule);
  }
  .search {
    flex: 1; min-width: 200px; display: flex; align-items: center; gap: 10px;
    background: var(--bg-1); border: 1px solid var(--rule);
    border-radius: 3px; padding: 9px 13px; transition: border-color 0.18s;
  }
  .search:focus-within { border-color: var(--brass); }
  .search input {
    border: none; background: none; outline: none;
    font-family: var(--ui); font-size: 13px; width: 100%; color: var(--text);
  }
  .search input::placeholder { color: var(--text-4); }
  .search svg { flex: none; color: var(--text-4); }

  .filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filterlabel {
    font-family: var(--ui); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-4);
  }
  .chip {
    font-family: var(--ui); font-size: 11px; font-weight: 500;
    border: 1px solid var(--rule); background: var(--bg-1); color: var(--text-4);
    padding: 5px 12px; border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; gap: 5px; transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--rule-2); color: var(--text-3); }
  .chip[aria-pressed="true"] { background: var(--brass-g); color: var(--brass); border-color: var(--brass); }
  .chip .geodot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* sample banner */
  .banner {
    background: rgba(201,162,75,0.06); border: 1px solid rgba(201,162,75,0.2);
    border-radius: 3px; font-family: var(--ui); font-size: 11px; color: var(--brass);
    padding: 10px 14px; margin-top: 16px; display: flex; gap: 10px; line-height: 1.55;
  }

  /* ── MAIN ── */
  main { padding: 8px 0 80px; min-height: 60vh; }

  .lede {
    font-family: var(--body); font-size: 17px; line-height: 1.7; color: var(--text-3);
    margin: 24px 0 28px; max-width: 62ch;
  }

  /* cluster / section headings */
  .cluster-head {
    display: flex; align-items: center; gap: 12px;
    margin: 52px 0 0; padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .cl-badge {
    font-family: var(--ui); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-4);
  }
  .cl-label {
    font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--text-3);
  }
  .cl-blurb { font-family: var(--ui); font-size: 11px; color: var(--text-4); margin-left: auto; }

  .sec-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 40px 0 6px;
  }
  .sec-head-left { display: flex; align-items: center; gap: 10px; }
  .sec-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .sec-head h3 {
    font-family: var(--serif); font-weight: 600; font-size: 21px;
    letter-spacing: -0.01em; color: var(--text); font-optical-sizing: auto;
  }
  .sec-meta {
    font-family: var(--ui); font-size: 11px; color: var(--text-4);
    white-space: nowrap; letter-spacing: 0.04em;
  }
  .sec-blurb {
    font-family: var(--body); font-size: 14px; color: var(--text-4);
    margin: 2px 0 18px; font-style: italic;
  }

  /* ── ENTRY FEED — editorial hairline style ── */
  .feed { display: flex; flex-direction: column; }

  .entry {
    border-top: 1px solid var(--rule);
    padding: 36px 0 32px;
    transition: none; position: relative;
  }
  .entry:last-child { border-bottom: 1px solid var(--rule); }

  .entry-top {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .e-date {
    font-family: var(--ui); font-size: 11px; color: var(--text-4);
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .e-sec {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-4); font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .e-sec .sec-dot-inline {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .e-dot-sep { color: var(--rule-2); font-size: 10px; }
  .geo {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-4); display: inline-flex; align-items: center; gap: 4px; font-weight: 500;
  }
  .geo .geodot { width: 5px; height: 5px; border-radius: 50%; }

  .status {
    font-family: var(--ui); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 2px; margin-left: auto; font-weight: 600;
  }
  .status.new     { background: var(--new-bg); color: var(--new); }
  .status.updated { background: var(--upd-bg); color: var(--updated); }
  .status.stale   { background: var(--stale-bg); color: var(--stale); }

  .entry h4 {
    font-family: var(--serif); font-weight: 600; font-size: 22px;
    line-height: 1.25; letter-spacing: -0.015em; color: var(--text);
    margin: 0 0 12px; max-width: 58ch; font-optical-sizing: auto;
  }
  .summary {
    font-family: var(--body); font-size: 16px; color: var(--text-2); line-height: 1.65;
    margin: 0 0 16px; max-width: 62ch;
  }

  /* TAKE block — the signature element */
  .why {
    border-left: 3px solid var(--accent);
    padding: 14px 0 14px 20px;
    margin: 0 0 16px; max-width: 60ch;
    background: linear-gradient(90deg, var(--accent-g) 0%, transparent 70%);
  }
  .why .lbl {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent-hi); display: block;
    margin-bottom: 6px; font-weight: 600;
  }
  .why p {
    font-family: var(--body); font-size: 16px; color: var(--text);
    font-weight: 400; font-style: italic; margin: 0; line-height: 1.6;
  }

  /* sources — text links with brass underlines, no pill backgrounds */
  .srcs { display: flex; gap: 0; flex-wrap: wrap; align-items: center; }
  .slbl {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-4); margin-right: 10px; font-weight: 600;
  }
  .src {
    font-family: var(--ui); font-size: 11.5px; color: var(--text-4);
    display: inline-flex; align-items: center; gap: 4px;
    padding: 0;
    text-decoration: underline;
    text-decoration-color: var(--rule-2);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color 0.15s, text-decoration-color 0.15s;
  }
  .src:not(:last-child)::after {
    content: '·';
    margin: 0 8px;
    color: var(--rule-2);
    text-decoration: none;
    display: inline-block;
  }
  .src:hover { color: var(--brass); text-decoration-color: var(--brass); }
  .src .stype { display: none; }

  /* ── COUNTRIES ── */
  .ctry-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1px; margin: 28px 0; background: var(--rule);
  }
  .ctry-card {
    background: var(--bg); padding: 28px 24px;
    transition: background 0.2s ease;
  }
  .ctry-card:hover { background: var(--bg-1); }
  .ctry-card-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .ctry-card h3 {
    font-family: var(--serif); font-weight: 600; font-size: 20px;
    display: flex; align-items: center; gap: 8px; color: var(--text);
    font-optical-sizing: auto;
  }
  .ctry-flag { display:inline-flex; align-items:center; line-height:1; }
  .cc-count {
    font-family: var(--ui); font-size: 10px; color: var(--text-4);
    font-variant-numeric: tabular-nums;
  }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar {
    display: grid; grid-template-columns: 110px 1fr 28px;
    align-items: center; gap: 10px;
    font-family: var(--ui); font-size: 10px; color: var(--text-4);
    cursor: pointer; padding: 4px 0; transition: none;
  }
  .bar:hover .bar-label { color: var(--text-3); }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.03em; }
  .bar-track {
    height: 4px; background: var(--bg-2); overflow: hidden;
  }
  .bar-fill { height: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .bar-fill { transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  }
  .bar-n { text-align: right; font-variant-numeric: tabular-nums; }
  .fill-us     { background: var(--us); }
  .fill-canada { background: var(--canada); }
  .fill-india  { background: var(--india); }

  .ctry-feed-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 36px 0 16px; padding-top: 28px; border-top: 1px solid var(--rule);
  }
  .ctry-feed-head h3 {
    font-family: var(--serif); font-weight: 600; font-size: 18px; color: var(--text);
    font-optical-sizing: auto;
  }
  .ctry-feed-head .meta {
    font-family: var(--ui); font-size: 10px; color: var(--text-4);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ── SOURCES TABLE ── */
  .srcreg-wrap {
    overflow-x: auto; margin-top: 24px;
  }
  table.srcreg { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.srcreg th {
    font-family: var(--ui); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-4); text-align: left; padding: 12px 16px;
    border-bottom: 1px solid var(--rule-2); white-space: nowrap; font-weight: 600;
  }
  table.srcreg td {
    padding: 14px 16px; border-bottom: 1px solid var(--rule);
    vertical-align: top; color: var(--text-3);
    font-family: var(--ui); font-size: 13px;
  }
  table.srcreg tr:last-child td { border-bottom: none; }
  table.srcreg tr:hover td { background: var(--bg-1); }
  table.srcreg tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--brass); }
  .pubtype {
    font-family: var(--ui); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em;
    border: 1px solid var(--rule); padding: 2px 6px; border-radius: 2px; color: var(--text-4);
    font-weight: 500;
  }
  .srcreg a {
    color: var(--brass); font-family: var(--ui); font-size: 11px;
    text-decoration: underline; text-decoration-thickness: 1px;
    text-underline-offset: 2px; text-decoration-color: var(--rule-2);
    transition: all 0.15s;
  }
  .srcreg a:hover { color: var(--text); text-decoration-color: var(--text-3); }

  /* ── ABOUT ── */
  .about { max-width: 60ch; color: var(--text-2); line-height: 1.72; padding-top: 8px; }
  .about h3 {
    font-family: var(--serif); font-weight: 600; font-size: 18px;
    color: var(--text); margin: 36px 0 10px; letter-spacing: -0.01em;
    font-optical-sizing: auto;
  }
  .about p { margin: 0 0 14px; font-size: 16px; font-family: var(--body); }
  .about code {
    font-family: 'Courier New', monospace; font-size: 12px; background: var(--bg-1);
    border: 1px solid var(--rule); padding: 1px 6px; border-radius: 2px; color: var(--brass);
  }
  .pipe-steps {
    border-left: 2px solid var(--rule-2); padding: 20px 0 20px 24px; margin: 20px 0;
    display: flex; flex-direction: column; gap: 16px;
  }
  .step { display: flex; gap: 14px; align-items: flex-start; }
  .step-num {
    font-family: var(--ui); font-size: 10px; font-weight: 700; color: var(--brass);
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 1px solid var(--brass); border-radius: 50%; margin-top: 2px;
  }
  .step-body { color: var(--text-3); font-family: var(--body); font-size: 15px; }
  .step-body b { color: var(--text); font-weight: 600; }

  .empty {
    font-family: var(--ui); font-size: 12px; color: var(--text-4);
    padding: 64px 0; text-align: center; letter-spacing: 0.06em; text-transform: uppercase;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--rule); padding: 28px 0 48px;
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px; max-width: 1120px; margin: 0 auto;
  }
  .footer-left { display: flex; flex-direction: column; gap: 6px; }
  .footer-brand {
    font-family: var(--serif); font-size: 14px; font-weight: 600; color: var(--text-3);
    font-optical-sizing: auto;
  }
  .footer-contact {
    font-family: var(--ui); font-size: 11px; color: var(--text-4);
  }
  .footer-contact a {
    color: var(--brass); transition: color 0.15s;
    text-decoration: underline; text-decoration-thickness: 1px;
    text-underline-offset: 2px; text-decoration-color: var(--rule-2);
  }
  .footer-contact a:hover { color: var(--text-2); text-decoration-color: var(--text-3); }
  .footer-right {
    text-align: right; font-family: var(--ui); font-size: 10px;
    color: var(--text-4); line-height: 1.9;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .wrap, .wrap--wide { padding: 0 16px; }
    .brand h1 { font-size: 19px; }
    .live-text { display: none; }
    .entry { padding: 28px 0 24px; }
    .entry h4 { font-size: 19px; }
    .sec-head h3 { font-size: 18px; }
    .ctry-grid { grid-template-columns: 1fr; }
    .stats-strip { font-size: 11px; }
    .cl-blurb { display: none; }
    .filter-group { flex-wrap: wrap; }
    footer { padding: 24px 0 40px; }
  }
  @media (max-width: 480px) {
    .sec-blurb { display: none; }
    body { font-size: 16px; }
  }

  /* ── SECTION JUMP NAV ── */
  .sec-jump {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 16px 0 10px;
  }
  .sec-jump-pill {
    font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: 0.05em;

<script>
const GEO_COLOR = { US: 'var(--us)', Canada: 'var(--canada)', India: 'var(--india)', Global: 'var(--global)' };
const GEO_FLAG  = {
  US: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#B22234"/><rect y="1.15" width="22" height="1.15" fill="#fff"/><rect y="3.46" width="22" height="1.15" fill="#fff"/><rect y="5.77" width="22" height="1.15" fill="#fff"/><rect y="8.08" width="22" height="1.15" fill="#fff"/><rect y="10.38" width="22" height="1.15" fill="#fff"/><rect y="12.69" width="22" height="1.15" fill="#fff"/><rect width="9" height="8.08" fill="#3C3B6E"/></svg>`,
  Canada: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#fff"/><rect width="5.5" height="15" fill="#D52B1E"/><rect x="16.5" width="5.5" height="15" fill="#D52B1E"/><polygon points="11,2.5 12.2,5.5 15.5,5.5 12.8,7.5 13.8,10.5 11,8.5 8.2,10.5 9.2,7.5 6.5,5.5 9.8,5.5" fill="#D52B1E"/></svg>`,
  India: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#fff"/><rect width="22" height="5" fill="#FF9933"/><rect y="10" width="22" height="5" fill="#138808"/><circle cx="11" cy="7.5" r="2.2" fill="none" stroke="#000080" stroke-width="0.6"/><circle cx="11" cy="7.5" r="0.4" fill="#000080"/></svg>`,
  Global: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15" style="border-radius:2px;vertical-align:middle;display:inline-block"><rect width="22" height="15" fill="#1E2535" rx="2"/><circle cx="11" cy="7.5" r="5" fill="none" stroke="#34D399" stroke-width="1"/><ellipse cx="11" cy="7.5" rx="2.5" ry="5" fill="none" stroke="#34D399" stroke-width="0.8"/><line x1="6" y1="7.5" x2="16" y2="7.5" stroke="#34D399" stroke-width="0.8"/></svg>`
};
const GEO_FILL  = { US: 'fill-us', Canada: 'fill-canada', India: 'fill-india', Global: 'fill-us' };
const SEC_COLOR = {
  capital: 'var(--c-capital)', companies: 'var(--c-companies)',
  technology: 'var(--c-technology)', infrastructure: 'var(--c-infrastructure)',
  adoption: 'var(--c-adoption)', policy: 'var(--c-policy)',
  talent: 'var(--c-talent)', theses: 'var(--c-theses)'
};

const state = { view: 'week', q: '', geos: new Set(), statuses: new Set(), country: 'US', countrySec: null };
let TAX, SRC, ENT, SRCMAP;

function readEmbedded(id) {
  try { return JSON.parse(document.getElementById(id).textContent); } catch(e) { return null; }
}

async function load() {
  async function grab(path, embId) {
    try { const r = await fetch(path, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch(e) {}
    return readEmbedded(embId);
  }
  TAX = await grab('./data/taxonomy.json', 'embedded-taxonomy');
  SRC = await grab('./data/sources.json',  'embedded-sources');
  ENT = await grab('./data/entries.json',  'embedded-entries');
  SRCMAP = {}; (SRC.sources || []).forEach(s => SRCMAP[s.id] = s);
  ENT.entries = (ENT.entries || []).sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') || (b.added || '').localeCompare(a.added || ''));
  buildChrome(); render();
}

function refDate() {
  const m = ENT.entries.reduce((x, e) => e.added && e.added > x ? e.added : x, '');
  return m ? new Date(m) : new Date();
}
function inWeek(e) {
  const win = new Date(new Date().getTime() - 30 * 864e5);
  return e.date && new Date(e.date) >= win;
}
function fmtRange() {
  const now = new Date(), win = new Date(now.getTime() - 30 * 864e5);
  const f = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return f(win) + ' – ' + f(now) + ', ' + now.getFullYear();
}
function nextRefresh() {
  const now = new Date();
  const next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 6, 0, 0));
  if (now >= next) next.setUTCDate(next.getUTCDate() + 1);
  return next;
}
function fmtCountdown() {
  const diff = Math.max(0, nextRefresh() - Date.now());
  const h = Math.floor(diff / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  const s = Math.floor((diff % 6e4) / 1e3);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function secById(id) { return TAX.sections.find(s => s.id === id); }
function clusterSections(cid) { return TAX.sections.filter(s => s.cluster === cid); }

function passes(e) {
  if (state.geos.size && !e.geography.some(g => state.geos.has(g))) return false;
  if (state.statuses.size && !state.statuses.has(e.status)) return false;
  if (state.q) {
    const t = (e.title + ' ' + e.summary + ' ' + e.why_it_matters).toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false;
  }
  return true;
}
function filtered() { return ENT.entries.filter(passes); }

/* ── chrome ── */
function buildChrome() {
  const wk = ENT.entries.filter(inWeek).length;
  const all = ENT.entries.length;
  const srcs = (SRC.sources || []).length;
  const secs = TAX.sections.length;

  // stats strip — editorial sentence
  document.getElementById('statsstrip').innerHTML =
    `<span class="stat-n">${wk}</span> new this week`
    + `<span class="stat-sep">·</span><span class="stat-n">${all}</span> total entries`
    + `<span class="stat-sep">·</span><span class="stat-n">${secs}</span> sections`
    + `<span class="stat-sep">·</span><span class="stat-n">3</span> markets`
    + `<span class="stat-sep">·</span><span class="stat-n">${srcs}</span> sources`;

  // tabs
  const tabs = [
    ['week',     'Recent', wk],
    ['sections', 'Sections',  all],
    ['countries','Countries', null],
    ['sources',  'Sources',   srcs],
    ['about',    'About',     null],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([id, lab, ct]) =>
    `<button data-v="${id}" aria-current="${state.view === id}">${lab}${ct != null ? `<span class="ct">${ct}</span>` : ''}</button>`
  ).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    state.view = b.dataset.v; buildChrome(); render(); window.scrollTo(0, 0);
  });

  // live badge — recomputes asofDate from current data each call
  const asofEl = document.getElementById('asof');
  function tickBadge() {
    const asofDate = refDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    asofEl.innerHTML = `<b>LIVE</b> · as of ${asofDate}<br>next refresh · <span id="countdown">${fmtCountdown()}</span>`;
  }
  tickBadge();

  // geo chips
  document.getElementById('geochips').innerHTML =
    `<span class="filterlabel">Geo</span>` +
    TAX.geographies.map(g =>
      `<button class="chip" data-g="${g}" aria-pressed="${state.geos.has(g)}" aria-label="Filter by ${g}">
        <span class="geodot" style="background:${GEO_COLOR[g]}"></span>${g}
      </button>`
    ).join('');
  document.querySelectorAll('#geochips .chip').forEach(c => c.onclick = () => {
    const g = c.dataset.g; state.geos.has(g) ? state.geos.delete(g) : state.geos.add(g);
    buildChrome(); render();
  });

  // status chips
  document.getElementById('statuschips').innerHTML =
    `<span class="filterlabel">Status</span>` +
    TAX.statuses.map(s =>
      `<button class="chip" data-s="${s}" aria-pressed="${state.statuses.has(s)}" aria-label="Filter by ${s}">${s}</button>`
    ).join('');
  document.querySelectorAll('#statuschips .chip').forEach(c => c.onclick = () => {
    const s = c.dataset.s; state.statuses.has(s) ? state.statuses.delete(s) : state.statuses.add(s);
    buildChrome(); render();
  });

  // sample banner
  const nSample = ENT.entries.filter(e => e.sample).length;
  document.getElementById('banner').innerHTML = nSample
    ? `<div class="banner">◆ &nbsp;<span><b>Sample data.</b> ${nSample} of ${ENT.entries.length} entries are illustrative placeholders. They are replaced automatically when the weekly pipeline runs, or edit <b>data/entries.json</b> directly.</span></div>`
    : '';

  // footer stats
  document.getElementById('foot-stats').innerHTML =
    `The AI Brief By Shaurya Gulati · structured AI-market intelligence<br>${all} entries · ${srcs} sources · ${secs} sections`;
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });

/* ── entry card ── */
function entryHTML(e) {
  const sec  = secById(e.section);
  const col  = SEC_COLOR[e.section] || 'var(--border)';
  const geos = e.geography.map(g =>
    `<span class="geo"><span class="geodot" style="background:${GEO_COLOR[g]}"></span>${g}</span>`
  ).join('');
  const srcs = (e.sources || []).map(id => {
    const s = SRCMAP[id]; if (!s) return '';
    const inner = `<span class="stype">${s.type}</span>${s.publisher || s.title}`;
    const href  = s.url && s.url !== '#' ? s.url : null;
    return href
      ? `<a class="src" href="${href}" target="_blank" rel="noopener">${inner} ↗</a>`
      : `<span class="src">${inner}</span>`;
  }).join('');

  return `<article class="entry" data-section="${e.section}">
    <div class="entry-top">
      <span class="e-sec"><span class="sec-dot-inline" style="background:${col}"></span>${sec ? sec.label : e.section}</span>
      <span class="e-dot-sep">·</span>
      ${geos}
      <span class="e-dot-sep">·</span>
      <span class="e-date">${e.date}</span>
      <span class="status ${e.status}">${e.status}</span>
    </div>
    <h4>${e.title}</h4>
    <p class="summary">${e.summary}</p>
    <div class="why"><span class="lbl">Take</span><p>${e.why_it_matters}</p></div>
    ${srcs ? `<div class="srcs"><span class="slbl">Via</span>${srcs}</div>` : ''}
  </article>`;
}

function feed(list) {
  return list.length
    ? `<div class="feed">${list.map(entryHTML).join('')}</div>`
    : `<div class="empty">No entries match the current filters.</div>`;
}

/* ── views ── */
/* ── collapse state (persisted per-section) ── */
const COLLAPSED_KEY = 'aibrief:sections:v1';
function loadCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveCollapsed(set) {
  try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...set])); } catch {}
}
let secCollapsed = loadCollapsed();

function viewWeek() {
  const list = filtered().filter(inWeek);
  // Build 5-bullet digest from the 5 newest entries' why_it_matters lines
  const top5 = [...list].sort((a,b) => (b.date||'').localeCompare(a.date||'')).slice(0,5);
  const digest = top5.length
    ? `<details open style="margin:20px 0 28px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;">
        <summary style="cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:0.01em;list-style:none;display:flex;align-items:center;gap:8px;">
          <span style="color:var(--accent-2)">↓</span> This week in 5
        </summary>
        <ol style="margin:12px 0 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;">
          ${top5.map(e=>`<li style="font-size:13.5px;color:var(--text-2);line-height:1.55;">${e.why_it_matters}</li>`).join('')}
        </ol>
      </details>`
    : '';
  let html = `<p class="lede">The latest developments across the AI economy, filed by type and tagged by market. Covering ${fmtRange()}.</p>${digest}`;
  TAX.clusters.forEach(cl => {
    const secs = clusterSections(cl.id);
    const clEntries = secs.flatMap(s => list.filter(e => e.section === s.id));
    if (!clEntries.length) return;
    html += `<div class="cluster-head">
      <span class="cl-badge">${cl.id}</span>
      <span class="cl-label">${cl.label}</span>
      <span class="cl-blurb">${cl.blurb}</span>
    </div>`;
    secs.forEach(s => {
      const es = list.filter(e => e.section === s.id); if (!es.length) return;
      const col = SEC_COLOR[s.id] || 'var(--text-3)';
      html += `<div class="sec-head">
        <div class="sec-head-left">
          <span class="sec-dot" style="color:${col};background:${col}"></span>
          <h3>${s.label}</h3>
        </div>
        <span class="sec-meta">${es.length} this week · ${s.cadence}</span>
      </div>`;
      html += feed(es);
    });
  });
  if (!list.length) html += `<div class="empty">No entries in this window match the current filters.</div>`;
  return html;
}

function viewSections() {
  const list = filtered();
  const allSecIds = TAX.sections.map(s => s.id);
  const anyOpen = allSecIds.some(id => !secCollapsed.has(id));

  // jump-nav pills
  let jumpNav = `<div class="sec-jump">`;
  TAX.sections.forEach(s => {
    const n = list.filter(e => e.section === s.id).length;
    const col = SEC_COLOR[s.id] || 'var(--text-3)';
    jumpNav += `<a class="sec-jump-pill" href="#sec-${s.id}" data-sec="${s.id}" aria-label="Jump to ${s.label}">
      <span class="sjdot" style="background:${col}"></span>${s.label}<span class="sjct">${n}</span>
    </a>`;
  });
  jumpNav += `</div>`;

  const collapseAllBtn = `<div class="sec-controls">
    <button id="sec-collapse-all" aria-label="${anyOpen ? 'Collapse all sections' : 'Expand all sections'}">
      ${anyOpen ? 'Collapse all' : 'Expand all'}
    </button>
  </div>`;

  let html = `<p class="lede">Every fact lives in exactly one section, chosen by its type — a round is a transaction, a startup is an entity, a chip is an asset. Cross-referenced, never duplicated.</p>
  ${jumpNav}${collapseAllBtn}`;

  TAX.clusters.forEach(cl => {
    html += `<div class="cluster-head">
      <span class="cl-badge">${cl.id}</span>
      <span class="cl-label">${cl.label}</span>
      <span class="cl-blurb">${cl.blurb}</span>
    </div>`;
    clusterSections(cl.id).forEach(s => {
      const es = list.filter(e => e.section === s.id);
      const col = SEC_COLOR[s.id] || 'var(--text-3)';
      const collapsed = secCollapsed.has(s.id);
      const expanded = !collapsed;
      html += `<div id="sec-${s.id}" style="scroll-margin-top:180px;">
        <div class="sec-head">
          <button class="sec-head-btn" data-sec="${s.id}" aria-expanded="${expanded}" aria-controls="panel-${s.id}">
            <div class="sec-head-left">
              <span class="sec-dot" style="color:${col};background:${col}"></span>
              <h3>${s.label}</h3>
            </div>
            <span class="sec-meta">${es.length} ${es.length === 1 ? 'entry' : 'entries'} · ${s.cadence}</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div class="sec-panel${collapsed ? ' collapsed' : ''}" id="panel-${s.id}" role="region" aria-labelledby="sec-${s.id}">
          <p class="sec-blurb">${s.blurb}</p>
          ${feed(es)}
        </div>
      </div>`;
    });
  });
  return html;
}

function viewCountries() {
  const list = filtered();
  let html = `<p class="lede">The same entries, pivoted by market. Geography is an overlay on the thematic sections — not a separate silo — so the three desks stay comparable.</p>`;
  html += `<div class="ctry-grid">`;
  ['US', 'Canada', 'India'].forEach(g => {
    const es  = list.filter(e => e.geography.includes(g));
    const max = Math.max(1, ...TAX.sections.map(s => es.filter(e => e.section === s.id).length));
    const bars = TAX.sections.map(s => {
      const n   = es.filter(e => e.section === s.id).length;
      const pct = Math.round(n / max * 100);
      return `<div class="bar" data-g="${g}" data-s="${s.id}" aria-label="${s.label}: ${n} entries">
        <span class="bar-label">${s.label}</span>
        <span class="bar-track"><span class="bar-fill ${GEO_FILL[g]}" style="width:${pct}%"></span></span>
        <span class="bar-n">${n}</span>
      </div>`;
    }).join('');
    const active = state.country === g ? 'border-color:var(--border-2)' : '';
    html += `<div class="ctry-card" style="${active}">
      <div class="ctry-card-header">
        <h3><span class="ctry-flag">${GEO_FLAG[g]}</span>${g}</h3>
        <span class="cc-count">${es.length} ${es.length === 1 ? 'entry' : 'entries'}</span>
      </div>
      <div class="bars">${bars}</div>
    </div>`;
  });
  html += `</div>`;

  const sel = state.country || 'US';
  let ces = list.filter(e => e.geography.includes(sel));
  const secLabel = state.countrySec ? ` · ${(secById(state.countrySec) || { label: state.countrySec }).label}` : '';
  html += `<div class="ctry-feed-head">
    <h3>${GEO_FLAG[sel]} ${sel} feed${secLabel}</h3>
    <span class="meta">click a bar to filter by section</span>
  </div>`;
  if (state.countrySec) ces = ces.filter(e => e.section === state.countrySec);
  html += feed(ces);
  return html;
}

function viewSources() {
  const list = ENT.entries;
  let rows = '';
  (SRC.sources || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(s => {
    const cited = list.filter(e => (e.sources || []).includes(s.id)).length;
    const href  = s.url && s.url !== '#'
      ? `<a href="${s.url}" target="_blank" rel="noopener">open ↗</a>` : '—';
    rows += `<tr>
      <td>${s.title}</td>
      <td style="color:var(--text-3)">${s.publisher || '—'}</td>
      <td><span class="pubtype">${s.type}</span></td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--text-3)">${s.date || '—'}</td>
      <td style="font-family:var(--mono);font-size:11px;text-align:center">${cited}</td>
      <td>${href}</td>
    </tr>`;
  });
  return `<p class="lede">The source registry: every primary document stored once and referenced by entries. One canonical link, cited everywhere — so readers can always reach the parent report.</p>
    <div class="srcreg-wrap">
      <table class="srcreg">
        <thead><tr>
          <th>Document</th><th>Publisher</th><th>Type</th><th>Date</th><th>Cited</th><th>Link</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function viewAbout() {
  return `<div class="about">
    <p class="lede" style="margin-top:20px">
      A live, structured intelligence brief on the AI economy across the United States, Canada, and India —
      built for venture investors who need the signal, not the feed.
    </p>
    <h3>How it's organized</h3>
    <p>Eight content sections across four clusters: <b>the stack</b> (what's being built), <b>the market</b> (players & money), <b>the environment</b> (rules & people), and <b>synthesis</b> (the so-what). The organizing rule: every fact is filed by its <em>type</em> and cross-linked rather than duplicated. A funding round is a transaction (Capital); the startup that raised it is an entity (Companies); the chip it builds is an asset (Infrastructure).</p>
    <p>Geography is a cross-cutting <em>overlay</em>, not three silos. Every entry is tagged US / Canada / India / Global, and the Countries view pivots the same dataset so the three desks stay comparable.</p>
    <h3>Every entry carries</h3>
    <p>A date, geography tags, a section and sub-tag, a 2–3 sentence summary, a <code>why it matters</code> line written for an investor, one or more links into the source registry, and a status of <code>new</code>, <code>updated</code>, or <code>stale</code>.</p>
    <h3>How it stays live</h3>
    <p>A scheduled job runs every morning. It uses Claude with web search to research the day's developments across all eight sections and three markets, drafts entries in the atomic schema, and opens a pull request for review before anything publishes.</p>
    <div class="pipe-steps">
      <div class="step"><span class="step-num">1</span><span class="step-body"><b>Schedule</b> — GitHub Actions cron fires weekly.</span></div>
      <div class="step"><span class="step-num">2</span><span class="step-body"><b>Research</b> — Claude (Anthropic API + web search) drafts entries per section, with real source URLs.</span></div>
      <div class="step"><span class="step-num">3</span><span class="step-body"><b>Validate</b> — entries are schema-checked, deduped, and aged; a PR is opened for review.</span></div>
      <div class="step"><span class="step-num">4</span><span class="step-body"><b>Publish</b> — merging rebuilds this static site automatically.</span></div>
    </div>
    <p>All sections refresh daily. The pipeline runs every morning, picks up the most decision-relevant developments across each section, and opens a pull request for review before publishing.</p>
  </div>`;
}

function render() {
  const m = document.getElementById('main');
  const v = { week: viewWeek, sections: viewSections, countries: viewCountries, sources: viewSources, about: viewAbout }[state.view];
  m.innerHTML = v();

  if (state.view === 'countries') {
    m.querySelectorAll('.bar').forEach(b => b.onclick = () => {
      const g = b.dataset.g, s = b.dataset.s;
      state.country = g;
      state.countrySec = (state.country === g && state.countrySec === s) ? null : s;
      render();
    });
  }

  if (state.view === 'sections') {
    // section toggle buttons
    m.querySelectorAll('.sec-head-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sid = btn.dataset.sec;
        const panel = document.getElementById('panel-' + sid);
        const isExpanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!isExpanded));
        panel.classList.toggle('collapsed', isExpanded);
        if (isExpanded) secCollapsed.add(sid); else secCollapsed.delete(sid);
        saveCollapsed(secCollapsed);
        // update collapse-all button text
        const allIds = TAX.sections.map(s => s.id);
        const stillAnyOpen = allIds.some(id => !secCollapsed.has(id));
        const cab = document.getElementById('sec-collapse-all');
        if (cab) { cab.textContent = stillAnyOpen ? 'Collapse all' : 'Expand all'; }
      });
    });

    // collapse all / expand all
    document.getElementById('sec-collapse-all')?.addEventListener('click', () => {
      const allIds = TAX.sections.map(s => s.id);
      const anyOpen = allIds.some(id => !secCollapsed.has(id));
      if (anyOpen) { allIds.forEach(id => secCollapsed.add(id)); }
      else { secCollapsed.clear(); }
      saveCollapsed(secCollapsed);
      render();
    });

    // jump-nav: expand if collapsed, then scroll
    m.querySelectorAll('.sec-jump-pill').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const sid = a.dataset.sec;
        if (secCollapsed.has(sid)) {
          secCollapsed.delete(sid);
          saveCollapsed(secCollapsed);
          render();
          requestAnimationFrame(() => {
            document.getElementById('sec-' + sid)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        } else {
          document.getElementById('sec-' + sid)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  }
}

load().then(() => {
  // countdown ticks every second — single interval, outside buildChrome
  setInterval(() => {
    const el = document.getElementById('countdown');
    if (el) el.textContent = fmtCountdown();
  }, 1000);

  // re-fetch entries every 5 min so "as of" date and content stay live
  setInterval(async () => {
    try {
      const r = await fetch('./data/entries.json', { cache: 'no-store' });
      if (!r.ok) return;
      const fresh = await r.json();
      ENT = fresh;
      ENT.entries = (ENT.entries || []).sort((a, b) =>
        (b.date || '').localeCompare(a.date || '') || (b.added || '').localeCompare(a.added || ''));
      buildChrome(); render();
    } catch(e) {}
  }, 5 * 60 * 1000);
});

// Reading progress bar
(function() {
  const bar = document.getElementById('progress-bar');
  if (!bar) return;
  document.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = h.scrollTop / (h.scrollHeight - h.clientHeight);
    bar.style.transform = `scaleX(${Math.min(1, pct)})`;
    bar.style.width = '100%';
  }, { passive: true });
})();
</script>
</body>
</html>
